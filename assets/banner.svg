<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Eric Siciliano, estudante de Engenharia de Computação na FIAP">
  <style>
    .cursor { animation: piscar 1.1s steps(1) infinite; }
    @keyframes piscar { 50% { opacity: 0; } }
  </style>
  <defs>
    <clipPath id="janela"><rect x="1" y="1" width="998" height="248" rx="12"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#39d353" opacity="0.04"/>
    </pattern>
    <radialGradient id="brilho" cx="22%" cy="55%" r="55%">
      <stop offset="0" stop-color="#39d353" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#janela)">
    <rect width="1000" height="250" fill="#0d1117"/>
    <rect y="40" width="1000" height="210" fill="url(#brilho)"/>
    <rect y="40" width="1000" height="210" fill="url(#scan)"/>
    <rect width="1000" height="40" fill="#161b22"/>
  </g>
  <rect x="1" y="1" width="998" height="248" rx="12" fill="none" stroke="#30363d" stroke-width="2"/>
  <line x1="1" y1="40" x2="999" y2="40" stroke="#30363d" stroke-width="2"/>
  <circle cx="24" cy="21" r="6" fill="#30363d"/>
  <circle cx="44" cy="21" r="6" fill="#30363d"/>
  <circle cx="64" cy="21" r="6" fill="#39d353"/>
  <text x="500" y="26" text-anchor="middle" font-size="13" fill="#8b949e">tibin05@github: ~</text>

  <text x="40" y="84" font-size="18" fill="#c9d1d9"><tspan fill="#39d353">$</tspan> whoami</text>
  <text x="40" y="142" font-size="48" font-weight="700" fill="#39d353" filter="url(#glow)">Eric Siciliano</text>
  <text x="40" y="180" font-size="19" fill="#c9d1d9">Estudante de Engenharia de Computação · FIAP</text>
  <text x="40" y="222" font-size="18" fill="#39d353">$</text>
  <rect class="cursor" x="62" y="207" width="10" height="19" fill="#39d353"/>
</svg>
